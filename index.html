    <meta property="og:title" content="Financia — Mutual Funds, Gold, Debt Funds &amp; ETFs Intelligence" />
    <meta
      property="og:description"
      content="Live market intelligence for Indian Direct Mutual Funds, physical-backed Spot Gold (PAXG), and the U.S. Treasury yield curve powered by official AMFI, Binance, and FMP feeds."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        var EXT_RE = /(?:chrome|moz|safari|edge)-extension:\/\//i;
        function isExtOnly(filename, stack) {
          if (filename && EXT_RE.test(filename)) return true;
          if (stack && EXT_RE.test(stack)) {
            var frames = String(stack)
              .split('\n')
              .map(function (l) { return l.trim(); })
              .filter(function (l) { return l.indexOf('at ') === 0 || l.indexOf('@') !== -1; });
            if (frames.length > 0 && frames.every(function (l) { return EXT_RE.test(l); })) {
              return true;
            }
          }
          return false;
        }
        window.addEventListener(
          'error',
          function (e) {
            if (isExtOnly(e.filename, e.error && e.error.stack)) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var r = e.reason;
            if (r && isExtOnly('', r.stack)) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
  </head>
  <body class="bg-white text-[#090e1a] antialiased selection:bg-[#2563eb]/20 selection:text-[#090e1a]">
    <div id="root"></div>

  </body>
